# Example: a remote source MCP server reached over streamable HTTP.
# Exposed at http://localhost:8000/mcp/docs once enabled.
name: docs
enabled: false
description: Read-only documentation search, proxied from a remote MCP server.

source:
  transport: http      # use `sse` for legacy servers with an /sse endpoint
  url: https://mcp.example.com/mcp
  headers:
    Authorization: Bearer ${DOCS_MCP_TOKEN}
  read_timeout_seconds: 60

tools:
  allow:
    - search_*
    - read_*
  block: []
