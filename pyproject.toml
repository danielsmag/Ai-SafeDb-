[project]
name = "mcp-gateway"
version = "0.1.0"
description = "FastAPI gateway that re-exposes YAML-defined MCP servers under one origin"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.0",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.3",
    "sqlglot>=30.14.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pyright>=1.1.400",
    "ruff>=0.14.4",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration: requires a running local LLM",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
