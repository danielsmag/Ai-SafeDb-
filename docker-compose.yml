services:
  gateway:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: aisafedb-mcp-gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_CONFIG_DIR: /app/mcp-servers
      GATEWAY_POLICIES_DIR: /app/policies
      GATEWAY_PIPELINES_DIR: /app/pipelines
      GATEWAY_WORKFLOWS_DIR: /app/workflows
      GATEWAY_SOURCES_DIR: /app/sources
      GATEWAY_OUTPUTS_DIR: /app/outputs
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8000}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_LLM__BASE_URL: ${GATEWAY_LLM__BASE_URL:-http://host.docker.internal:11434/v1}
      GATEWAY_GUARD__ENABLED: ${GATEWAY_GUARD__ENABLED:-false}
      GATEWAY_DATABASE__HOST: postgres
      GATEWAY_DATABASE__PORT: "5432"
      GATEWAY_DATABASE__USER: ${POSTGRES_USER:-aisafe}
      GATEWAY_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:-aisafe}
      GATEWAY_DATABASE__NAME: ${POSTGRES_DB:-aisafedb}
      SAFE_DB_SCHEMA: ${SAFE_DB_SCHEMA:-aisafedb}
      POSTGRES_MCP_URL: postgresql://${POSTGRES_USER:-aisafe}:${POSTGRES_PASSWORD:-aisafe}@postgres:5432/${POSTGRES_DB:-aisafedb}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./settings.toml:/app/settings.toml:ro
      - ./mcp-servers:/app/mcp-servers:ro
      - ./policies:/app/policies:ro
      - ./pipelines:/app/pipelines:ro
      - ./workflows:/app/workflows:ro
      - ./sources:/app/sources:ro
      - ./outputs:/app/outputs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisafedb-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      gateway:
        condition: service_healthy

  docs:
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
    container_name: aisafedb-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8001}:80"

  postgres-mcp:
    image: mcp/postgres
    build:
      context: ./docker/postgres-mcp
    profiles:
      - tools

  # Linux/NVIDIA only. On macOS, run `ollama serve` on the host for Metal.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:17-alpine
    container_name: aisafedb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisafe}
      POSTGRES_DB: ${POSTGRES_DB:-aisafedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisafe} -d ${POSTGRES_DB:-aisafedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aisafedb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
